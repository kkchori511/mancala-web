<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>4인 보드 배치 도면</title>
<style>
  html, body { margin: 0; background: #f3efe9; }
  svg { display: block; }
</style>
</head>
<body>
<div id="out"></div>
<script>
// ?mode=tablet|monitor  (tablet 2048×1536, monitor 1920×1080)
const mode = new URLSearchParams(location.search).get('mode') || 'tablet';
const W = mode === 'tablet' ? 2048 : 1920, H = mode === 'tablet' ? 1536 : 1080;
const S = mode === 'tablet' ? 1420 : 1010;           // 보드 한 변
const bx = (W - S) / 2, by = (H - S) / 2;
const m = S * 0.035;                                  // 보드 테두리 여백 (화살표 자리)
const c = S * 0.19;                                   // 모서리 저장고 한 변
const g = S * 0.012;                                  // 칸 사이 간격
const inner = S - 2 * m;
const pw = (inner - 2 * c - 6 * g) / 5;               // 칸 폭(변 방향)
const pd = c;                                         // 칸 깊이(안쪽 방향) = 저장고와 같게
const COL = { 1: '#2a9d8f', 2: '#e9806e', 3: '#3d4e7a', 4: '#93b94a' };
const ROT = { 1: 0, 2: -90, 3: 180, 4: 90 };
let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="ah" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="7" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 z" fill="#c9b79a"/></marker></defs>
<rect x="${bx}" y="${by}" width="${S}" height="${S}" rx="${S * 0.04}" fill="#eadfcd" stroke="#d8c9b1" stroke-width="3"/>`;
const rr = (x, y, w, h, r, fill, extra = '') => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${fill}" ${extra}/>`;
const x0 = bx + m, y0 = by + m, x1 = bx + S - m, y1 = by + S - m;
// 저장고: P1 오른쪽 아래, P2 오른쪽 위, P3 왼쪽 위, P4 왼쪽 아래
const stores = { 1: [x1 - c, y1 - c], 2: [x1 - c, y0], 3: [x0, y0], 4: [x0, y1 - c] };
for (const p in stores) {
  const [x, y] = stores[p];
  s += rr(x, y, c, c, c * 0.18, COL[p], 'opacity=".38"');
  s += rr(x, y, c, c, c * 0.18, 'none', `stroke="${COL[p]}" stroke-width="${p == 1 ? 7 : 3}" ${p == 1 ? 'opacity="1"' : 'opacity=".7"'}`);
  s += `<text x="${x + c / 2}" y="${y + c / 2}" font-size="${c * 0.14}" text-anchor="middle" dominant-baseline="central" fill="#6b5a44" font-family="Arial">저장고 P${p}</text>`;
}
// 칸 (반시계 진행 순서대로 번호)
const pitR = Math.min(pw, pd) * 0.22;
for (let i = 0; i < 5; i++) {
  const along = c + g + i * (pw + g);
  const label = (p, n, x, y) => `<text x="${x}" y="${y}" font-size="${pw * 0.22}" text-anchor="middle" dominant-baseline="central" fill="#8a775c" font-family="Arial">P${p}-${n}</text>`;
  // P1 아래 변: 왼→오
  let x = x0 + along, y = y1 - pd;
  s += rr(x, y, pw, pd, pitR, '#ddcbae') + label(1, i + 1, x + pw / 2, y + pd / 2);
  // P2 오른쪽 변: 아래→위
  x = x1 - pd; y = y1 - along - pw;
  s += rr(x, y, pd, pw, pitR, '#ddcbae') + label(2, i + 1, x + pd / 2, y + pw / 2);
  // P3 위 변: 오→왼
  x = x1 - along - pw; y = y0;
  s += rr(x, y, pw, pd, pitR, '#ddcbae') + label(3, i + 1, x + pw / 2, y + pd / 2);
  // P4 왼쪽 변: 위→아래
  x = x0; y = y0 + along;
  s += rr(x, y, pd, pw, pitR, '#ddcbae') + label(4, i + 1, x + pd / 2, y + pw / 2);
}
// 가장자리 진행 방향 화살표(은은하게): 각 변 가운데 테두리 여백에
const arrow = (xa, ya, xb, yb) => `<line x1="${xa}" y1="${ya}" x2="${xb}" y2="${yb}" stroke="#c9b79a" stroke-width="3" marker-end="url(#ah)"/>`;
const L = S * 0.06, cxB = bx + S / 2, cyB = by + S / 2;
for (const off of [-S * 0.22, 0, S * 0.22]) {
  s += arrow(cxB + off - L / 2, by + S - m / 2, cxB + off + L / 2, by + S - m / 2);  // 아래: →
  s += arrow(bx + S - m / 2, cyB - off + L / 2, bx + S - m / 2, cyB - off - L / 2);  // 오른쪽: ↑
  s += arrow(cxB - off + L / 2, by + m / 2, cxB - off - L / 2, by + m / 2);          // 위: ←
  s += arrow(bx + m / 2, cyB + off - L / 2, bx + m / 2, cyB + off + L / 2);          // 왼쪽: ↓
}
// 가운데 차례 표시
const cs = S - 2 * m - 2 * pd;
s += `<rect x="${x0 + pd + g}" y="${y0 + pd + g}" width="${cs - 2 * g}" height="${cs - 2 * g}" rx="20" fill="none" stroke="#d8c9b1" stroke-dasharray="10 8"/>`;
s += `<text x="${cxB}" y="${cyB - 30}" font-size="${S * 0.03}" text-anchor="middle" fill="#8a775c" font-family="Arial">가운데 공간 (차례 표시 · 캡처 빛줄기)</text>`;
s += mode === 'tablet'
  ? `<path d="M${cxB} ${cyB} l0 ${S * 0.1} m-${S * 0.04} -${S * 0.04} l${S * 0.04} ${S * 0.04} l${S * 0.04} -${S * 0.04}" stroke="${COL[1]}" stroke-width="12" fill="none" stroke-linecap="round"/>`
  : `<rect x="${cxB - 90}" y="${cyB + 10}" width="180" height="60" rx="30" fill="${COL[1]}"/><text x="${cxB}" y="${cyB + 40}" font-size="30" text-anchor="middle" dominant-baseline="central" fill="#fff" font-family="Arial">▶ P1</text>`;
// 바깥 플레이어 배지(이름+점수) + 사람 위치를 가리키는 화살표
// 배치: 각자 저장고 모서리 쪽 좌우 빈 공간. P1 오른쪽 아래(↓), P2 오른쪽 위(→), P3 왼쪽 위(↑), P4 왼쪽 아래(←)
const side = bx;                                  // 좌우 빈 공간 폭
const bw = Math.min(side * 0.72, 260), bh = bw * 0.42;
const badges = {
  1: [bx + S + side / 2, by + S - c / 2, 'down'],
  2: [bx + S + side / 2, by + c / 2, 'right'],
  3: [bx - side / 2, by + c / 2, 'up'],
  4: [bx - side / 2, by + S - c / 2, 'left'],
};
const scores = { 1: 19, 2: 16, 3: 12, 4: 9 };
for (const p in badges) {
  const [cx, cy, dir] = badges[p];
  const rot = mode === 'tablet' ? ROT[p] : 0;
  s += `<g transform="rotate(${rot} ${cx} ${cy})">
    <rect x="${cx - bw / 2}" y="${cy - bh / 2}" width="${bw}" height="${bh}" rx="${bh / 2}" fill="${COL[p]}" ${p == 1 ? 'stroke="#fff" stroke-width="5"' : ''}/>
    <text x="${cx - bw * 0.22}" y="${cy}" font-size="${bh * 0.48}" text-anchor="middle" dominant-baseline="central" fill="#fff" font-weight="700" font-family="Arial">P${p}</text>
    <rect x="${cx + bw * 0.02}" y="${cy - bh * 0.36}" width="${bw * 0.44}" height="${bh * 0.72}" rx="${bh * 0.36}" fill="#fff"/>
    <text x="${cx + bw * 0.24}" y="${cy}" font-size="${bh * 0.48}" text-anchor="middle" dominant-baseline="central" fill="#222" font-weight="700" font-family="Arial">${scores[p]}</text>
  </g>`;
  // 사람 위치 화살표 (태블릿만): 배지 옆 작은 삼각형 3개(쉐브론)
  if (mode === 'tablet') {
    const v = { down: [0, 1], up: [0, -1], left: [-1, 0], right: [1, 0] }[dir];
    const isV = v[0] === 0;
    const reach = bh / 2 + 26, t = 16;
    for (let k = 0; k < 3; k++) {
      const px = cx + v[0] * (reach + k * 26), py = cy + v[1] * (reach + k * 26);
      const a = Math.atan2(v[1], v[0]);
      const pts = [[t, 0], [-t * 0.7, -t], [-t * 0.7, t]].map(([u, w]) => [px + u * Math.cos(a) - w * Math.sin(a), py + u * Math.sin(a) + w * Math.cos(a)]);
      s += `<polygon points="${pts.map(q => q.join(',')).join(' ')}" fill="${COL[p]}" opacity="${0.9 - k * 0.25}"/>`;
    }
  }
}
if (mode === 'monitor') {
  s += `<rect x="${bx + S + side * 0.1}" y="${by + c + 60}" width="${side * 0.8}" height="${S - 2 * c - 120}" rx="24" fill="#fbf8f3" stroke="#e2d8c8"/>
  <text x="${bx + S + side / 2}" y="${by + S / 2}" font-size="26" text-anchor="middle" fill="#8a775c" font-family="Arial">최근 기록</text>
`;
}
s += `<text x="20" y="${H - 20}" font-size="20" fill="#9a8b74" font-family="Arial">칸 ${pw.toFixed(0)}×${pd.toFixed(0)}px (비율 1:${(pd / pw).toFixed(2)}) · 저장고 ${c.toFixed(0)}px · 가운데 ${(cs).toFixed(0)}px (보드의 ${(100 * cs / S).toFixed(0)}%)</text></svg>`;
document.getElementById('out').innerHTML = s;
</script>
</body>
</html>
